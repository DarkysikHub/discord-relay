name: 24/7 Relay to Discord (Каждую 1 минуту)

on:
  schedule:
    # Запуск каждые 5 минут
    - cron: '*/5 * * * *'
  workflow_dispatch: # Позволяет запускать вручную кнопкой Run

concurrency:
  group: discord-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Разрешение сохранять seen_posts.json в репозиторий

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Кэширование ускоряет частые запуски

      - name: Установка библиотек
        run: |
          python -m pip install --upgrade pip
          # Если есть requirements.txt, раскомментируйте строку ниже:
          # pip install -r requirements.txt
          pip install requests beautifulsoup4

      - name: Проверка источников каждую 1 минуту
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PYTHONUNBUFFERED: "1" # Вывод print() сразу попадает в консоль без задержек буфера
        run: |
          echo "=== Старт частой проверки источников ==="
          for i in 1 2 3 4; do
            echo "--> Проверка $i/4: $(date -u)"
            python relay.py --once
            if [ $i -lt 4 ]; then
              echo "Пауза 60 секунд..."
              sleep 60
            fi
          done
          echo "=== 4 цикла завершены ==="
        timeout-minutes: 5

      - name: Сохранение seen_posts.json (защита от дублей)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add seen_posts.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen posts [skip ci]" && git push)
